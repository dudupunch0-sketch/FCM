<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FCM · 모션 작업실</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101719;color:#e9eee7;font:15px system-ui}main{max-width:1160px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #34413f;padding-bottom:18px}h1{font-size:28px;margin:6px 0}small,.muted{color:#aab6ad}a{color:#d6f477}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:28px;margin-top:24px}canvas{display:block;width:100%;background:#1b2528;border:1px solid #35443e;border-radius:6px}fieldset{border:0;margin:0 0 20px;padding:0}legend{font-size:12px;color:#aab6ad;letter-spacing:.12em;margin-bottom:12px}label{display:block;margin:12px 0}input[type=range]{width:100%;accent-color:#d6f477;min-height:32px}select,button,textarea{font:inherit;background:#24312e;color:inherit;border:1px solid #46564d;border-radius:4px;min-height:44px;padding:9px 12px}select{width:100%}button{cursor:pointer}button.primary{background:#d6f477;color:#172113;border-color:#d6f477}button:disabled{opacity:.45;cursor:wait}.buttons{display:flex;gap:8px;flex-wrap:wrap}.readout{font:13px ui-monospace,monospace;line-height:1.8;padding:14px;background:#18231e;border-left:3px solid #d6f477;margin:16px 0}output{float:right;font-variant-numeric:tabular-nums}textarea{width:100%;min-height:130px}details{margin-top:18px}summary{cursor:pointer;min-height:44px;padding-top:12px}p{line-height:1.6}.notice{font-size:13px;color:#b4bcb5}#message{min-height:24px;color:#d6f477}input[type=checkbox]{accent-color:#d6f477}@media(max-width:720px){main{padding:16px}.layout{grid-template-columns:1fr;gap:18px}header{gap:12px}h1{font-size:23px}canvas{max-height:62vh;object-fit:contain}aside{display:grid;grid-template-columns:1fr 1fr;gap:16px}aside>details,aside>.buttons,aside>p{grid-column:1/-1}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main>
<header><div><small>FCM / MOTION WORKBENCH</small><h1>모션 작업실</h1></div><a href="/?art=cel">게임 시안</a></header>
<div class="layout"><section>
<canvas width="760" height="660" role="img" aria-label="원화를 재사용하는 관절 애니메이션"></canvas>
<label>동작 진행 <output id="position">0%</output><input id="progress" aria-label="동작 진행" type="range" min="0" max="1000" value="0"></label>
<div class="buttons"><button id="play" class="primary" disabled>재생</button><button id="contact" disabled>접촉 시점</button><button id="reset" disabled>기본값</button></div>
<div class="readout" id="metrics" role="status">원화 불러오는 중…</div>
<div class="buttons"><label><input id="bones" type="checkbox" checked> 관절 표시</label><label><input id="ghost" type="checkbox"> 원본 겹쳐 보기</label></div>
<p class="notice">원화 한 장을 움직이는 제작 시제품. 큰 회전의 몸통·어깨 경계와 위빙의 다리는 추가 보정이 필요합니다. 게임의 전투 판정은 바꾸지 않습니다.</p>
</section><aside>
<fieldset><legend>동작</legend><label>템플릿<select id="action"><option value="hook">훅</option><option value="guard">상단 가드</option><option value="weave">위빙</option></select></label><label>공격 손<select id="hand"><option value="lead">앞손 · 가까운 팔</option><option value="rear">뒷손 · 먼 팔</option></select></label>
<label>재생 시간 <output data-value="durationMs"></output><input data-param="durationMs" aria-label="재생 시간" type="range" min="250" max="2400" step="10"></label>
<label>중심 시점 <output data-value="contact"></output><input data-param="contact" aria-label="중심 시점" type="range" min="0.4" max="0.85" step="0.01"></label></fieldset>
<fieldset><legend>움직임</legend><label>접촉 위치 X <output data-value="targetX"></output><input data-param="targetX" aria-label="접촉 위치 X" type="range" min="400" max="600" step="1"></label><label>접촉 위치 Y <output data-value="targetY"></output><input data-param="targetY" aria-label="접촉 위치 Y" type="range" min="190" max="380" step="1"></label><label>상체 이동 <output data-value="lean"></output><input data-param="lean" aria-label="상체 이동" type="range" min="0" max="65" step="1"></label><label>위빙 깊이 <output data-value="depth"></output><input data-param="depth" aria-label="위빙 깊이" type="range" min="0" max="100" step="1"></label></fieldset>
<div class="buttons"><button id="save" disabled>동작 JSON 저장</button><button id="atlas" disabled>12프레임 PNG</button></div>
<details><summary>동작 파일 불러오기</summary><p class="muted">저장한 JSON 내용을 붙여 넣으세요.</p><textarea id="json" aria-label="동작 JSON" spellcheck="false"></textarea><button id="import" disabled>적용</button></details>
<details id="frame-data" hidden><summary>내보내기 정보</summary><textarea id="frame-json" aria-label="프레임 좌표 JSON" readonly></textarea></details>
<p id="message" role="status"></p><p class="notice">조절·재생·저장 시 AI 호출 없음. 파일은 다운로드되며 서버에 업로드되지 않습니다.</p>
</aside></div></main><script type="module" src="./motion-workbench.js"></script></body></html>
